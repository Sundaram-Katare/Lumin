services:
  client:
    build:
      context: ./client
      args:
        VITE_BACKEND_API_URL: /api/
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/lumin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: lumin
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:

